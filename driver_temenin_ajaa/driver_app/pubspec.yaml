name: temenin_ajaa_driver
description: A standalone driver application for Temenin Ajaa.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.2.2
  flutter_animate: ^4.5.2
  google_fonts: ^6.2.1
  http: ^1.1.0
  provider: ^6.0.5
  supabase_flutter: ^2.0.0
  cupertino_icons: ^1.0.6
  image_picker: 1.1.2
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  geolocator: ^12.0.0
  image_cropper: ^8.0.2
  audioplayers: ^6.0.0
  video_player: 2.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
